version: 2

updates:
  # Dart / Flutter packages
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the action versions in .github/workflows current
  # (and is the mechanism for moving to SHA-pinned actions safely).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # After running scripts/bootstrap.sh you can also enable Gradle updates:
  # - package-ecosystem: gradle
  #   directory: /android
  #   schedule:
  #     interval: weekly
